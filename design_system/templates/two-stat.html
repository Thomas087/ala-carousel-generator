<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA — Two-stat slide template</title>
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body>
  <!-- TWO-STAT SLIDE
       An all-caps eyebrow, then two stacked stat blocks.
       Each stat block = big yellow number (+ optional white sign / unit)
       and a white caption. -->
  <div class="ala-stage">
    <div class="ala-slide">
      <div class="ala-grid"></div>

      <div class="ala-slide__body ala-x-center" style="justify-content: space-between; padding-top: 40px; padding-bottom: 40px;">
        <h2 class="ala-eyebrow">In 2025 alone…</h2>

        <div class="ala-stat ala-x-center" style="align-items:center;">
          <div class="ala-stat__value">
            <span class="ala-stat__sign">+</span>77<span class="ala-stat__unit">mil</span>
          </div>
          <div class="ala-stat__caption">more than 2024</div>
        </div>

        <div class="ala-stat ala-x-center" style="align-items:center;">
          <div class="ala-stat__value">
            <span class="ala-stat__sign">~</span>6<span class="ala-stat__unit">%</span>
          </div>
          <div class="ala-stat__caption">year-on-year growth</div>
        </div>
      </div>

      <img class="ala-logo" src="../assets/ala-logo-white.png" alt="ALA — Accountability Lens Asia">
    </div>
  </div>
</body>
</html>
