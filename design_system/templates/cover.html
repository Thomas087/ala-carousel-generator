<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA — Cover slide template</title>
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body>
  <!-- COVER / TITLE SLIDE
       Stacked all-caps headline, alternating yellow / white lines.
       Edit the .line text; swap line--yellow / line--white to taste. -->
  <div class="ala-stage">
    <div class="ala-slide">
      <div class="ala-grid"></div>

      <div class="ala-slide__body ala-middle">
        <h1 class="ala-headline">
          <span class="line line--yellow">More than</span>
          <span class="line line--white">a third of</span>
          <span class="line line--yellow">all eggs</span>
          <span class="line line--white">on earth</span>
        </h1>
      </div>

      <img class="ala-logo" src="../assets/ala-logo-white.png" alt="ALA — Accountability Lens Asia">
    </div>
  </div>
</body>
</html>
