<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA — Big-stat slide template</title>
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body>
  <!-- BIG STAT SLIDE
       One giant yellow hero number with a white supporting caption.
       The most reusable workhorse slide. -->
  <div class="ala-stage">
    <div class="ala-slide">
      <div class="ala-grid"></div>

      <div class="ala-slide__body ala-middle ala-x-center">
        <p class="ala-hero">19,400</p>
        <p class="ala-caption" style="margin-top: 18px;">
          eggs produced <span class="ala-em-yellow">every second</span>
        </p>
      </div>

      <img class="ala-logo" src="../assets/ala-logo-white.png" alt="ALA — Accountability Lens Asia">
    </div>
  </div>
</body>
</html>
